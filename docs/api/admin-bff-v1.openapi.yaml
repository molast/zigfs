        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateMultipartUploadRequest"
      responses:
        "201":
          description: ZigFS 已持久化上传任务
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/MultipartUpload"
  /api/v1/multipart-uploads/{uploadId}:
    parameters:
      - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/UploadID"
      - name: bucket
        in: query
        required: true
        schema:
          type: string
      - name: key
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: getMultipartUpload
      responses:
        "200":
          description: ZigFS 已提交分片
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/MultipartUpload"
    delete:
      operationId: abortMultipartUpload
      responses:
        "204":
          description: ZigFS 已取消上传并清理分片
  /api/v1/multipart-uploads/{uploadId}/complete:
    post:
      operationId: completeMultipartUpload
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/UploadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CompleteMultipartUploadRequest"
      responses:
        "200":
          description: ZigFS 已原子发布对象
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/Object"
  /api/v1/objects/presign:
    post:
      operationId: presignObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/PresignObjectRequest"
      responses:
        "200":
          description: ZigFS 直连 URL
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/PresignObjectResponse"
  /api/v1/users/{name}/access-keys:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
    get:
      operationId: listUserAccessKeys
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListAccessKeysResponse"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
    post:
      operationId: createUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateUserAccessKeyRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateAccessKeyResponse"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
  /api/v1/users/{name}/access-keys/{id}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
      - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
    patch:
      operationId: updateUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/AccessKey"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
    delete:
      operationId: deleteUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "204":
          description: Success
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
  /api/v1/access-keys:
    get:
      operationId: listAccessKeys
      responses:
        "200":
          description: Access Key 列表
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListAccessKeysResponse"
    post:
      operationId: createAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminAccessKeyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateAccessKeyResponse"
  /api/v1/access-keys/{id}:
    patch:
      operationId: updateAccessKey
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/AccessKey"
    delete:
      operationId: deleteAccessKey
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
      responses:
        "204":
          description: 已删除或不存在
  /api/v1/audit-events:
    get:
      summary: List global management and S3 audit events
      description: Requires management authority. Includes active and archived events; newest first. Offset pagination is not a snapshot.
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Non-negative offset }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: from, in: query, schema: { type: integer, format: int64 } }
        - { name: to, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string }, description: Standard event_action or legacy action exact match }
        - { name: outcome, in: query, schema: { type: string }, description: Normalized success/failure/denied/error/unknown or exact legacy outcome }
        - { name: category, in: query, schema: { type: string }, description: Event category }
        - { name: actor, in: query, schema: { type: string }, description: Principal name or ID }
        - { name: bucket, in: query, schema: { type: string }, description: Resource bucket }
        - { name: request_id, in: query, schema: { type: string }, description: Request correlation ID }
        - { name: source_ip, in: query, schema: { type: string }, description: ZigFS TCP peer IP }
        - { name: service, in: query, schema: { type: string }, description: Operation service }
        - { name: event_type, in: query, schema: { type: string }, description: Event type }
      responses:
        '200':
          description: Audit events page
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/AuditEventPage' }
        '400': { description: Invalid query }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Audit store unavailable }
  /api/v1/audit-events/options:
    get:
      summary: List audit categories and standard operation mappings
      responses:
        '200':
          description: Operation catalog for linked filter controls
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/AuditOptions' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
  /api/v1/settings/logs:
    get:
      summary: Read persisted runtime log configuration
      responses:
        '200':
          description: Current configuration (defaults when not configured)
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/LogConfig' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Log service unavailable }
    put:
      summary: Persist and immediately apply runtime log configuration
      description: Paths are relative to the ZigFS data root; absolute paths, traversal and symlinks are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/LogConfig' }
      responses:
        '200':
          description: Saved normalized configuration
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/LogConfig' }
        '400': { description: Invalid log configuration or directory }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Directory or configuration persistence failed }
  /api/v1/settings/logs/query:
    get:
      summary: Read bounded runtime log content
      description: Uses the configured directory and time range. Reads at most 1024 segments and 1 MiB; returns JSON, not a binary attachment.
      responses:
        '200':
          description: Log content and truncation status
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/LogQuery' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Log storage unavailable }
  /api/v1/settings/logs/download:
    get:
      summary: Download bounded runtime log content
      description: Uses the configured directory and time range. Reads at most 1024 segments and 1 MiB; returns JSON, not a binary attachment.
      responses:
        '200':
          description: Log content and truncation status
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/LogQuery' }
        '401': { description: Authentication required }
        '403': { description: Management authority required or downloads disabled }
        '503': { description: Log storage unavailable }
  /api/v1/settings/kms:
    get:
      summary: Read redacted KMS configuration and last enable-time health
      description: Requires management authority. Secrets are returned as empty strings.
      responses:
        '200':
          description: KMS status without network probing (healthChecked is false until start-time verification)
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSStatus' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Configuration store unavailable }
    put:
      summary: Validate and persist KMS configuration without contacting the provider
      description: >-
        Blank secrets preserve the existing value when saving the same backend.
        Local paths refer to the ZigFS server. Old profiles are retained for existing objects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSConfig' }
      responses:
        '200':
          description: Redacted active configuration and health
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSStatus' }
        '400': { description: Invalid configuration }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Configuration store or persistence failed }
  /api/v1/settings/kms/start:
    post:
      summary: Start KMS by verifying the saved backend and default key
      description: Requires management authority. Persists startup intent in xl.meta without saving the form draft. Enabled KMS is restored on ZigFS restart. Failure is retained in KMS status; GET and refresh do not retry.
      responses:
        '200':
          description: Running KMS status
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSStatus' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '503': { description: Backend initialization or key verification failed }

  /api/v1/settings/kms/stop:
    post:
      summary: Stop KMS and clear its in-memory keys
      description: Requires management authority. Does not delete key files. Stop persists disabled startup intent in xl.meta; Clear Cache does not change startup intent.
      responses:
        '200':
          description: Updated KMS runtime status
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSStatus' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '409': { description: KMS is not running }

  /api/v1/settings/kms/clear-cache:
    post:
      summary: Clear cached KMS keys without stopping the service
      description: Requires management authority. Does not delete key files. Stop persists disabled startup intent in xl.meta; Clear Cache does not change startup intent.
      responses:
        '200':
          description: Updated KMS runtime status
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSStatus' }
        '401': { description: Authentication required }
        '403': { description: Management authority required }
        '409': { description: KMS is not running }

  /api/v1/settings/kms/keys:
    get:
      summary: List KMS key metadata without key material
      description: Requires management authority and running KMS. Static keys are read-only.
      responses:
        '200':
          description: Metadata and backend capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSKey' } }
                  canCreate: { type: boolean }
                  canRekey: { type: boolean }
        '409': { description: KMS is not running }
        '503': { description: Key store or provider unavailable }
    post:
      summary: Create a KMS key and optionally make it the default
      description: Requires management authority and running KMS. IDs are generated by ZigFS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 256 }
                description: { type: string, maxLength: 4096 }
                setAsDefault: { type: boolean, default: false }
      responses:
        '201':
          description: Created key metadata
          content:
            application/json:
              schema: { $ref: './zigfs-management-v1.openapi.yaml#/components/schemas/KMSKey' }
        '400': { description: Invalid request }
        '409': { description: Backend does not support creation or KMS is not running }
        '503': { description: Key store or provider unavailable }
  /api/v1/settings/kms/keys/action:
    post:
      summary: Rotate, schedule deletion, restore, or permanently delete a key
      description: Requires management authority and running KMS. Immediate deletion supports enabled and pending-deletion keys. Deleting or scheduling deletion of the last key is rejected with HTTP 409 (KmsLastKeyDeletionForbidden). Pending state is enforced by ZigFS; the seven-day date does not trigger automatic deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string }
                action: { type: string, enum: [rotate, schedule-deletion, cancel-deletion, delete] }
      responses:
        '200': { description: Key action completed }
        '400': { description: Invalid request }
        '409': { description: Invalid key state, unsupported operation, or KMS is not running }
        '503': { description: Key store or provider unavailable }

components:
  securitySchemes:
    zigfsSessionCookie:
      type: apiKey
      in: cookie
      name: zigfs_admin_session
      description: ZigFS 签发、Admin 仅中转的短期 Management Token。
  schemas:
    OIDCProvider:
      type: object
      required: [provider_id, configuration_url, client_id, redirect_uri]
      description: Provider configuration stored encrypted in ZigFS. Role Policy is a comma-separated list of existing policy names, not local User roles. Environment-managed providers are imported at ZigFS startup and are read-only through this API.
      properties:
        provider_id:
          type: string
        display_name:
          type: string
        configuration_url:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scopes:
          type: string
        audiences:
          type: string
        redirect_uri:
          type: string
        claim_name:
          type: string
        claim_prefix:
          type: string
        role_policy:
          type: string
        groups_claim:
          type: string
        roles_claim:
          type: string
        email_claim:
          type: string
        username_claim:
          type: string
        enabled:
          type: boolean
        environment_managed:
          type: boolean
          readOnly: true
        has_secret:
          type: boolean
        dynamic_redirect:
          type: boolean
    UserWrite:
      type: object
      required: [name, enabled, policies]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$' }
        description: { type: string, default: '' }
        enabled: { type: boolean }
        policies:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
        groups:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
          description: When supplied, replaces group memberships atomically. Omit to preserve; an empty array removes all memberships.
        password:
          type: string
          writeOnly: true
          description: Required on create. 8–1024 UTF-8 bytes. Omit on update to retain the existing hash. Never returned; stored as an Argon2id hash.
    ManagedUser:
      type: object
      required: [name, enabled, policies, groups, updated_at]
      properties:
        groups:
          type: array
          items: { type: string }
          readOnly: true
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix seconds; zero for legacy records without a known update time.
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedGroup:
      type: object
      required: [name, enabled, policies, members]
      properties:
        updated_at:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
        members:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedPolicy:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_.-]+$'
        document:
          type: string
          description: JSON-encoded IAM policy document, Version 2012-10-17 and Statement object or array. Maximum 256 KiB. Assigned user/group policies authorize inheriting keys. Supports Condition, NotAction and NotResource; unsupported context keys/operators are rejected.
    CreateAdminBucketRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 不由浏览器提交。Admin 根据当前 ZigFS 管理员会话自动绑定 Bucket
        所属租户，再转发给 ZigFS Management API。
      required: [name]
      properties:
        name:
          type: string
    CreateAdminAccessKeyRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 不由浏览器提交。Admin 根据当前 ZigFS 管理员会话自动绑定凭证所属租户，
        再转发给 ZigFS Management API。
      properties:
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key JSON policy; restricts inherited permissions when enabled.
        access_key:
          type: string
          pattern: '^[A-Za-z0-9]{16,128}$'
          description: Optional custom AK; generated by ZigFS when omitted.
        secret_key:
          type: string
          minLength: 32
          maxLength: 64
          writeOnly: true
          description: Printable ASCII. Temporary token credentials require exactly 40 characters. Generated when omitted.
        name:
          type: string
          maxLength: 128
          description: Optional label; 128 UTF-8 bytes maximum.
        description:
          type: string
          maxLength: 1024
          description: Optional description; 1024 UTF-8 bytes maximum.
        inherit_policy:
          type: boolean
          default: false
          description: Use parent user and enabled-group permissions, with the key policy applied as an additional restriction. Disabling inheritance never grants permissions beyond the parent; UI defaults to true.
        expires_at:
          type: string
          format: date-time
          description: Future UTC expiry, no 12-hour limit. Omit for no expiry. Cannot be combined with ttl_seconds.
        policy:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CredentialPolicyInput"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 43200
          description: 提供时创建临时凭证，有效期为 60 秒至 12 小时。
