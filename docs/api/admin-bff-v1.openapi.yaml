  /api/v1/auth/login:
    post:
      operationId: loginAdminWeb
      summary: 转发登录到 ZigFS
      description: >-
        Admin 将凭证转发给 ZigFS。ZigFS 校验并签发 Token 后，Admin 仅将其写入
        HttpOnly、SameSite=Strict Cookie；响应正文不暴露 Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ZigFS 已确认登录，响应同时设置会话 Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/SessionResponse"
  /api/v1/auth/logout:
    post:
      operationId: logoutAdminWeb
      summary: 删除浏览器中的 ZigFS 会话 Cookie
      responses:
        "204":
          description: Cookie 已删除
  /api/v1/auth/session:
    get:
      operationId: getAdminWebSession
      summary: 由 ZigFS 校验当前会话
      responses:
