openapi: 3.1.0
info:
  title: ZigFS Admin BFF API
  version: 0.1.0
  description: >-
    React Admin 的网页适配接口。登录、身份、权限以及所有 Bucket、Object、
    AK/SK 和 System 操作都由 ZigFS 处理。Admin 只中转 ZigFS Token，
    不签发或验证 Token，也不持久化任何用户或业务状态。
servers:
  - url: http://127.0.0.1:9001
security:
  - zigfsSessionCookie: []
paths:
  /api/v1/users:
    get:
      summary: Get managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    post:
      summary: Post managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UserWrite"
                - type: object
                  required: [password]
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
  /api/v1/users/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      summary: Get managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    patch:
      summary: Patch managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWrite"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    delete:
      summary: Delete managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "204":
          description: Success
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
  /api/v1/groups:
    get:
      summary: Get managed groups
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedGroup"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    post:
      summary: Post managed groups
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedGroup"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedGroup"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
  /api/v1/groups/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      summary: Get managed groups
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedGroup"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    patch:
      summary: Patch managed groups
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedGroup"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedGroup"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    delete:
      summary: Delete managed groups
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "204":
          description: Success
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
  /api/v1/policies:
    get:
      summary: Get managed policy documents
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
    post:
      summary: Post managed policy documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedPolicy"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
  /api/v1/policies/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      summary: Get managed policy documents
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
    patch:
      summary: Patch managed policy documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedPolicy"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
    delete:
      summary: Delete managed policy documents
      responses:
        "204":
          description: Success
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
  /api/v1/auth/login:
    post:
      operationId: loginAdminWeb
      summary: 转发登录到 ZigFS
      description: >-
        Admin 将凭证转发给 ZigFS。ZigFS 校验并签发 Token 后，Admin 仅将其写入
        HttpOnly、SameSite=Strict Cookie；响应正文不暴露 Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ZigFS 已确认登录，响应同时设置会话 Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/SessionResponse"
  /api/v1/auth/logout:
    post:
      operationId: logoutAdminWeb
      summary: 删除浏览器中的 ZigFS 会话 Cookie
      responses:
        "204":
          description: Cookie 已删除
  /api/v1/auth/session:
    get:
      operationId: getAdminWebSession
      summary: 由 ZigFS 校验当前会话
      responses:
        "200":
          description: ZigFS 确认的当前身份和过期时间
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/SessionResponse"
  /api/v1/system:
    get:
      operationId: getSystem
      responses:
        "200":
          description: 系统信息
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/SystemInfo"
  /api/v1/storage:
    get:
      operationId: getStorage
      responses:
        "200":
          description: ZigFS 逻辑存储统计
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/StorageInfo"
  /api/v1/storage/scanner:
    get:
      operationId: getStorageScanner
      responses:
        "200":
          description: ZigFS 分片 Scanner 状态
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/StorageScannerStatus"
  /api/v1/storage/gc:
    post:
      operationId: runStorageGC
      responses:
        "200":
          description: ZigFS 完整 namespace 扫描与清理结果
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/StorageScanReport"
  /api/v1/management-health:
    get:
      operationId: getManagementHealth
      responses:
        "200":
          description: ZigFS Metadata 与 Storage 健康状态
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/Health"
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: ZigFS 脱敏后的只读生效配置
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/Settings"
  /api/v1/buckets:
    get:
      operationId: listBuckets
      responses:
        "200":
          description: Bucket 列表
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListBucketsResponse"
    post:
      operationId: createBucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminBucketRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/Bucket"
  /api/v1/buckets/{name}:
    delete:
      operationId: deleteBucket
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
      responses:
        "204":
          description: 已删除或不存在
  /api/v1/buckets/{name}/configuration:
    get:
      operationId: getBucketConfiguration
      summary: 转发读取 ZigFS Bucket 配置
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
      responses:
        "200":
          description: ZigFS 当前配置
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/BucketConfiguration"
    patch:
      operationId: updateBucketConfiguration
      summary: 转发更新 ZigFS Bucket 配置
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/UpdateBucketConfigurationRequest"
      responses:
        "200":
          description: ZigFS 更新后的配置
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/BucketConfiguration"
  /api/v1/buckets/{name}/versions:
    get:
      operationId: listObjectVersions
      summary: 转发读取 ZigFS 对象版本历史
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 对象版本与 DeleteMarker
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListObjectVersionsResponse"
  /api/v1/buckets/{name}/objects:
    get:
      operationId: listObjects
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
        - name: continuation_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 对象列表
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListObjectsResponse"
  /api/v1/buckets/{name}/multipart-uploads:
    get:
      operationId: listMultipartUploads
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
        - name: key_marker
          in: query
          schema:
            type: string
        - name: upload_id_marker
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ZigFS 中持久化的未完成上传
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListMultipartUploadsResponse"
  /api/v1/multipart-uploads:
    post:
      operationId: createMultipartUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateMultipartUploadRequest"
      responses:
        "201":
          description: ZigFS 已持久化上传任务
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/MultipartUpload"
  /api/v1/multipart-uploads/{uploadId}:
    parameters:
      - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/UploadID"
      - name: bucket
        in: query
        required: true
        schema:
          type: string
      - name: key
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: getMultipartUpload
      responses:
        "200":
          description: ZigFS 已提交分片
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/MultipartUpload"
    delete:
      operationId: abortMultipartUpload
      responses:
        "204":
          description: ZigFS 已取消上传并清理分片
  /api/v1/multipart-uploads/{uploadId}/complete:
    post:
      operationId: completeMultipartUpload
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/UploadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CompleteMultipartUploadRequest"
      responses:
        "200":
          description: ZigFS 已原子发布对象
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/Object"
  /api/v1/objects/presign:
    post:
      operationId: presignObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/PresignObjectRequest"
      responses:
        "200":
          description: ZigFS 直连 URL
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/PresignObjectResponse"
  /api/v1/users/{name}/access-keys:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
    get:
      operationId: listUserAccessKeys
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListAccessKeysResponse"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
    post:
      operationId: createUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateUserAccessKeyRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateAccessKeyResponse"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
  /api/v1/users/{name}/access-keys/{id}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
      - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
    patch:
      operationId: updateUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/AccessKey"
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
    delete:
      operationId: deleteUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "204":
          description: Success
        default:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/responses/Error"
  /api/v1/access-keys:
    get:
      operationId: listAccessKeys
      responses:
        "200":
          description: Access Key 列表
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/ListAccessKeysResponse"
    post:
      operationId: createAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminAccessKeyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CreateAccessKeyResponse"
  /api/v1/access-keys/{id}:
    patch:
      operationId: updateAccessKey
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/AccessKey"
    delete:
      operationId: deleteAccessKey
      parameters:
        - $ref: "./zigfs-management-v1.openapi.yaml#/components/parameters/AccessKeyID"
      responses:
        "204":
          description: 已删除或不存在
components:
  securitySchemes:
    zigfsSessionCookie:
      type: apiKey
      in: cookie
      name: zigfs_admin_session
      description: ZigFS 签发、Admin 仅中转的短期 Management Token。
  schemas:
    UserWrite:
      type: object
      required: [name, enabled, policies]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$' }
        description: { type: string, default: '' }
        enabled: { type: boolean }
        policies:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
        groups:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
          description: When supplied, replaces group memberships atomically. Omit to preserve; an empty array removes all memberships.
        password:
          type: string
          writeOnly: true
          description: Required on create. 8–1024 UTF-8 bytes. Omit on update to retain the existing hash. Never returned; stored as an Argon2id hash.
    ManagedUser:
      type: object
      required: [name, enabled, policies, groups, updated_at]
      properties:
        groups:
          type: array
          items: { type: string }
          readOnly: true
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix seconds; zero for legacy records without a known update time.
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedGroup:
      type: object
      required: [name, enabled, policies, members]
      properties:
        updated_at:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
        members:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedPolicy:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_.-]+$'
        document:
          type: string
          description: JSON-encoded IAM policy document, Version 2012-10-17 and Statement object or array. Maximum 256 KiB. Assigned user/group policies authorize inheriting keys. Supports Condition, NotAction and NotResource; unsupported context keys/operators are rejected.
    CreateAdminBucketRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 不由浏览器提交。Admin 根据当前 ZigFS 管理员会话自动绑定 Bucket
        所属租户，再转发给 ZigFS Management API。
      required: [name]
      properties:
        name:
          type: string
    CreateAdminAccessKeyRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 不由浏览器提交。Admin 根据当前 ZigFS 管理员会话自动绑定凭证所属租户，
        再转发给 ZigFS Management API。
      properties:
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key JSON policy; restricts inherited permissions when enabled.
        access_key:
          type: string
          pattern: '^[A-Za-z0-9]{16,128}$'
          description: Optional custom AK; generated by ZigFS when omitted.
        secret_key:
          type: string
          minLength: 32
          maxLength: 64
          writeOnly: true
          description: Printable ASCII. Temporary token credentials require exactly 40 characters. Generated when omitted.
        name:
          type: string
          maxLength: 128
          description: Optional label; 128 UTF-8 bytes maximum.
        description:
          type: string
          maxLength: 1024
          description: Optional description; 1024 UTF-8 bytes maximum.
        inherit_policy:
          type: boolean
          default: false
          description: Use parent user and enabled-group permissions, with the key policy applied as an additional restriction. Disabling inheritance never grants permissions beyond the parent; UI defaults to true.
        expires_at:
          type: string
          format: date-time
          description: Future UTC expiry, no 12-hour limit. Omit for no expiry. Cannot be combined with ttl_seconds.
        policy:
          $ref: "./zigfs-management-v1.openapi.yaml#/components/schemas/CredentialPolicyInput"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 43200
          description: 提供时创建临时凭证，有效期为 60 秒至 12 小时。
