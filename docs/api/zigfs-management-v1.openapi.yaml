        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
  /_admin/v1/policies:
    get:
      summary: Get managed policy documents
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
    post:
      summary: Post managed policy documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedPolicy"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedPolicy"
        "400":
          description: Invalid policy name or document
        "401":
          description: Authentication required
        "404":
          description: Policy not found
        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
  /_admin/v1/policies/{name}:
    parameters:
      - in: path
        name: name
        required: true
