openapi: 3.1.0
info:
  title: ZigFS Management API
  version: 1.0.0
  description: >-
    ZigFS 独立提供的管理接口。Admin 只是调用方之一；授权用户和自动化系统
    可以在不部署 Admin 的情况下直接调用。管理员身份、密码校验、Token
    签发与验证、权限和所有业务状态均由 ZigFS 负责；Admin 不参与认证决策。
servers:
  - url: http://127.0.0.1:9000
security:
  - managementBearer: []
paths:
  /_admin/v1/buckets/{name}/directories:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: Directory key ending in a slash }
      responses:
        '201': { description: Directory created }
    delete:
      summary: Delete a folder and its current objects or all versions
      description: >-
        Requires admin:* management authority. Default deletion uses S3 versioning
        semantics and preserves historical versions in enabled buckets. all_versions=true
        permanently deletes every historical version and delete marker under the exact
        slash-terminated prefix. Legal Hold and retention are enforced. A concurrent write
        may return 409; partial progress is possible and retries are supported even after
        the folder record is removed. Physical orphan data is reclaimed by GC.
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string, minLength: 2 }
          description: Slash-terminated folder key; empty and root prefixes are rejected.
        - in: query
          name: all_versions
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Folder deleted }
        '400': { description: Invalid key or options }
        '403': { description: Permission denied or protected version }
        '409': { description: Concurrent changes or remaining live content }
        '503': { description: Storage failure; inspect contents before retrying }
  /_admin/v1/buckets/{name}/directories/cleanup:
    post:
      summary: Force cleanup folder
      description: >-
        Requires admin:* management authority. Repairs stale directory index entries
        against authoritative metadata and runs the shared reachability-based garbage
        collector. Removes index entries whose persistent record is absent or tombstoned;
        restores missing or outdated index state for valid directory records.
        Healthy empty folders, current objects, historical versions, delete markers,
        and active multipart uploads are preserved. This is not recursive deletion.
        Unreadable or corrupt authoritative metadata requires recovery and is never
        discarded on the assumption that it is garbage. Repairs may partially complete
        before an error; retries are supported. Shared GC can also reclaim unreferenced
        data elsewhere while preserving all reachable data.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 2, description: Slash-terminated folder key; root is forbidden }
      responses:
        '204': { description: Directory reconciliation and orphan-data collection completed }
        '400': { description: Invalid folder key }
        '403': { description: Permission denied or protected version }
        '409': { description: Concurrent changes or remaining live content }
        '503': { description: Repair incomplete or corrupt metadata requires recovery }
  /_admin/v1/auth/oidc/refresh:
    post:
      summary: Renew OIDC identity and synchronize profile and policies
      description: Accepts JSON token containing the opaque OIDC session token; called by BFF.
      responses:
        '200':
          description: Updated public session profile
        '401':
          description: Session unavailable or renewal rejected
  /_admin/v1/auth/oidc/end-session:
    post:
      summary: Revoke local session and obtain IdP logout URL
      description: Accepts JSON token containing the opaque OIDC session token; called by BFF.
      responses:
        '200':
          description: logout_url, empty when IdP logout is unavailable
        '401':
          description: Session unavailable or renewal rejected
  /_admin/v1/auth/oidc/backchannel-logout:
    post:
      security: []
      summary: Verify signed IdP logout token and revoke matching federated sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, logout_token]
              properties:
                provider_id: { type: string }
                logout_token: { type: string }
      responses:
        '204':
          description: Matching sessions revoked
        '400':
          description: Invalid or replayed logout token
  /_admin/v1/oidc/validate:
    post:
      summary: Validate discovery and JWKS availability (deployment administrator only)
      description: Does not validate client credentials; complete a login to verify them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProvider'
      responses:
        '200':
          description: Discovery and JWKS available
        '400':
          description: Invalid provider or discovery response
        '403':
          description: Deployment administrator required
  /_admin/v1/auth/oidc/providers:
    get:
      security: []
      summary: List enabled login choices (provider_id and display_name only)
      responses:
        '200':
          description: Public provider list
  /_admin/v1/auth/oidc/web-identity:
    post:
      security: []
      summary: Exchange a supported signed web identity JWT for temporary S3 credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, web_identity_token]
              properties:
                provider_id: { type: string }
                web_identity_token: { type: string, writeOnly: true }
                duration_seconds: { type: integer, minimum: 60, maximum: 3600, default: 3600 }
                session_policy:
                  type: string
                  description: Optional IAM JSON restriction; cannot expand inherited permissions.
      responses:
        '201':
          description: One-time credential response; expiration is capped by JWT and provider session
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_key: { type: string }
                  secret_key: { type: string }
                  session_token: { type: string }
                  expires_at: { type: integer }
                  subject_id: { type: string }
        '400':
          description: Invalid duration or session policy
        '401':
          description: Invalid identity token, expired identity, disabled provider or invalid policy mapping
  /_admin/v1/auth/oidc/start:
    post:
      security: []
      summary: OIDC start delegated by the BFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id]
              properties:
                provider_id: { type: string }
      responses:
        '200':
          description: Authorization URL and state
        '401':
          description: Invalid identity or flow
  /_admin/v1/auth/oidc/callback:
    post:
      security: []
      summary: OIDC callback delegated by the BFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Opaque login token and independent federated identity
        '401':
          description: Invalid identity or flow
  /_admin/v1/auth/oidc/logout:
    post:
      security: []
      summary: OIDC logout delegated by the BFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: Session revoked
        '401':
          description: Invalid identity or flow
  /_admin/v1/oidc/providers:
    get:
      summary: List persisted OIDC provider configurations (deployment administrator only)
      description: Client secrets are always empty in responses; has_secret indicates a stored secret. login_supported is true. Enabled providers support authorization-code login and web-identity credentials.
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  login_supported:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OIDCProvider'
        "403":
          description: Deployment administrator required
        "503":
          description: OIDC storage unavailable or corrupt
    post:
      summary: Create an OIDC provider configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProvider'
      responses:
        "201":
          description: Created; client_secret is redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProvider'
        "400":
          description: Invalid provider, URL, scope, credentials or policy reference
        "409":
          description: Provider ID already exists
  /_admin/v1/oidc/providers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      summary: Replace provider configuration; ID is immutable
      description: An empty client_secret preserves the existing encrypted secret. Other fields replace the configuration. Configuration changes invalidate existing provider sessions and temporary credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProvider'
      responses:
        "200":
          description: Updated; client_secret is redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProvider'
        "404":
          description: Provider not found
    delete:
      summary: Delete provider configuration
      responses:
        "204":
          description: Deleted
        "404":
          description: Provider not found
  /_admin/v1/users:
    get:
      summary: Get managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
    post:
      summary: Post managed users
      description: Management metadata only; assignments do not change S3 authorization or Admin login. Names are immutable. Updates replace the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UserWrite"
                - type: object
                  required: [password]
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid identity, duplicate selections or missing reference
        "401":
          description: Authentication required
        "404":
          description: User or group not found
        "409":
          description: Name already exists
        "503":
          description: Persistent storage unavailable
