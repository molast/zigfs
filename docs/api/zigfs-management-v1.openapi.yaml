openapi: 3.1.0
info:
  title: ZigFS Management API
  version: 0.1.0
  description: >-
    ZigFS 独立提供的管理接口。Admin 只是调用方之一；授权用户和自动化系统
    可以在不部署 Admin 的情况下直接调用。管理员身份、密码校验、Token
    签发与验证、权限和所有业务状态均由 ZigFS 负责；Admin 不参与认证决策。
servers:
  - url: http://127.0.0.1:9000
security:
  - managementBearer: []
paths:
  /_admin/v1/auth/login:
    post:
      operationId: loginManagementUser
      summary: 登录 ZigFS Management API
      description: 凭证由 ZigFS 校验，成功后由 ZigFS 签发短期 Management Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/auth/session:
    get:
      operationId: getManagementSession
      summary: 校验 ZigFS Management Session
      responses:
        "200":
          description: 当前身份和过期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets:
    get:
      operationId: listBuckets
      summary: 列出 Bucket
      responses:
        "200":
          description: Bucket 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBucketsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBucket
      summary: 创建 Bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBucketRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}:
    delete:
      operationId: deleteBucket
      summary: 删除空 Bucket
      parameters:
        - $ref: "#/components/parameters/BucketName"
      responses:
        "204":
          description: 已删除或不存在
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}/objects:
    get:
      operationId: listObjects
      summary: 获取管理视图中的对象列表
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
        - name: continuation_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 对象列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectsResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/objects/presign:
    post:
      operationId: presignObject
      summary: 生成直接访问 ZigFS 的对象 URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignObjectRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignObjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/access-keys:
    get:
      operationId: listAccessKeys
      summary: 列出 Access Key
      responses:
        "200":
          description: Access Key 列表，不包含 Secret Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessKeysResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccessKey
      summary: 创建 AK/SK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessKeyRequest"
      responses:
        "201":
          description: Secret Key 只在此响应返回一次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccessKeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/access-keys/{id}:
    patch:
      operationId: updateAccessKey
      summary: 启用或禁用 Access Key
      parameters:
        - $ref: "#/components/parameters/AccessKeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccessKey
      summary: 删除 Access Key
      parameters:
        - $ref: "#/components/parameters/AccessKeyID"
      responses:
        "204":
          description: 已删除或不存在
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/storage:
    get:
      operationId: getStorage
      summary: 获取存储容量和状态
      responses:
        "200":
          description: 存储状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageInfo"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/system:
    get:
      operationId: getSystem
      summary: 获取系统汇总信息
      responses:
        "200":
          description: 系统信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/health:
    get:
      operationId: getManagementHealth
      summary: 获取 Metadata Engine 和 Storage Backend 健康状态
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/settings:
    get:
      operationId: getManagementSettings
      summary: 获取脱敏后的 ZigFS 生效配置
      description: >-
        仅返回可安全展示的启动级配置，不返回管理员密码、Session Secret、
        Master Key 或 AK/SK Secret。V1 配置修改后需要重启，因此本接口只读。
      responses:
        "200":
          description: 脱敏后的生效配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    managementBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-management-token
  parameters:
    BucketName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
    AccessKeyID:
      name: id
      in: path
      required: true
      description: V1 中等于 access_key，作为 Credential 的稳定管理标识。
      schema:
        type: string
  responses:
    Error:
      description: 失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, token_type, username, expires_at]
      properties:
        token:
          type: string
          writeOnly: true
        token_type:
          type: string
          const: Bearer
        username:
          type: string
        expires_at:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, username, expires_at]
      properties:
        authenticated:
          type: boolean
          const: true
        username:
          type: string
        expires_at:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒
    Bucket:
      type: object
      additionalProperties: false
      required: [name, owner, created_at]
      properties:
        name:
          type: string
        owner:
          type: string
        created_at:
          type: string
          format: date-time
    ListBucketsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
    CreateBucketRequest:
      type: object
      additionalProperties: false
      required: [name, owner]
      properties:
        name:
          type: string
        owner:
          type: string
          minLength: 1
          maxLength: 256
    Object:
      type: object
      required: [key, size, etag, last_modified]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
    ListObjectsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Object"
        continuation_token:
          type: string
    PresignObjectRequest:
      type: object
      additionalProperties: false
      required: [access_key, bucket, key, method, expires_seconds]
      properties:
        access_key:
          type: string
          description: >-
            ZigFS 使用该 Credential 的加密 Secret 生成签名，并校验其启用状态、
            Policy 和 Bucket Owner；Secret 不由调用方传入。
        bucket:
          type: string
        key:
          type: string
        method:
          type: string
          enum: [GET, PUT]
        expires_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
    PresignObjectResponse:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    AccessKey:
      type: object
      required: [id, access_key, owner, enabled, policy, created_at]
      properties:
        id:
          type: string
          description: V1 中等于 access_key。
        access_key:
          type: string
        owner:
          type: string
        enabled:
          type: boolean
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
        created_at:
          type: string
          format: date-time
    ListAccessKeysResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccessKey"
    CreateAccessKeyRequest:
      type: object
      additionalProperties: false
      required: [owner]
      description: 省略 policy 时由 ZigFS 创建 Full Access Credential。
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 256
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
    CreateAccessKeyResponse:
      allOf:
        - $ref: "#/components/schemas/AccessKey"
        - type: object
          required: [secret_key]
          properties:
            secret_key:
              type: string
              writeOnly: true
      unevaluatedProperties: false
    UpdateAccessKeyRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    CredentialPolicy:
      type: object
      additionalProperties: false
      required: [bucket_read, bucket_write, object_read, object_write]
      properties:
        bucket_read:
          type: boolean
          default: true
        bucket_write:
          type: boolean
          default: true
        object_read:
          type: boolean
          default: true
        object_write:
          type: boolean
          default: true
    StorageInfo:
      type: object
      additionalProperties: false
      description: >-
        V1 使用 ZigFS 当前可见 Object Metadata 汇总逻辑对象字节数。
        底层文件系统物理容量不通过不可移植的 Transport 系统调用推测，
        因此未配置正式容量 Backend 时 total 和 available 为 null。
      required: [measurement, total, used, available]
      properties:
        measurement:
          type: string
          const: logical_object_bytes
        total:
          type: [integer, "null"]
          format: int64
          minimum: 0
        used:
          type: integer
          format: int64
          minimum: 0
        available:
          type: [integer, "null"]
          format: int64
          minimum: 0
    SystemInfo:
      type: object
      required: [version, uptime, storage_used, objects, buckets]
      properties:
        version:
          type: string
        uptime:
          type: integer
          format: int64
        storage_used:
          type: integer
          format: int64
        objects:
          type: integer
          format: int64
        buckets:
          type: integer
          format: int64
    Health:
      type: object
      additionalProperties: false
      required: [status, recovery, reason, actions]
      properties:
        status:
          type: string
          enum: [ready, degraded, recovery]
        recovery:
          type: string
          enum: [initializing, recovering, ready, recovery_required]
        reason:
          type: string
          enum:
            - none
            - corrupt_journal
            - corrupt_record
            - inconsistent_journal
            - unrecoverable_transaction
            - unavailable
            - out_of_memory
        actions:
          type: array
          items:
            type: string
            enum: [inspect_logs, restore_from_backup]
    Settings:
      type: object
      additionalProperties: false
      required:
        - api_address
        - s3_public_endpoint
        - s3_region
        - request_time_skew_seconds
        - multipart_expiry_seconds
        - stream_buffer_size
        - metrics_enabled
        - metrics_address
        - admin_session_ttl_seconds
        - reload_required
      properties:
        api_address:
          type: string
        s3_public_endpoint:
          type: string
          format: uri
        s3_region:
          type: string
        request_time_skew_seconds:
          type: integer
          format: int64
        multipart_expiry_seconds:
          type: integer
          format: int64
        stream_buffer_size:
          type: integer
          format: int64
        metrics_enabled:
          type: boolean
        metrics_address:
          type: string
        admin_session_ttl_seconds:
          type: integer
          format: int64
        reload_required:
          type: boolean
          const: true
    Error:
      type: object
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
