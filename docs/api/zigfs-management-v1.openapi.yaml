        "409":
          description: Policy already exists
        "503":
          description: Policy storage unavailable
  /_admin/v1/auth/login:
    post:
      operationId: loginManagementUser
      summary: 登录 ZigFS Management API
      description: 凭证由 ZigFS 校验，成功后由 ZigFS 签发短期 Management Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/auth/session:
    get:
      operationId: getManagementSession
      summary: 校验 ZigFS Management Session
      responses:
        "200":
          description: 当前身份和过期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets:
    get:
      operationId: listBuckets
      summary: 列出 Bucket
      responses:
        "200":
          description: Bucket 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBucketsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBucket
      summary: 创建 Bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBucketRequest"
      responses:
        "200":
          description: 已存在且属于当前或请求中的 owner（幂等结果）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}:
    delete:
      operationId: deleteBucket
      summary: 删除空 Bucket
      parameters:
        - $ref: "#/components/parameters/BucketName"
      responses:
        "204":
          description: 已删除或不存在
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}/configuration:
    get:
      operationId: getBucketConfiguration
      summary: 获取 Bucket Versioning 与 Lifecycle 配置
      parameters:
        - $ref: "#/components/parameters/BucketName"
      responses:
        "200":
          description: ZigFS 持久化的 Bucket 配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketConfiguration"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBucketConfiguration
      summary: 更新 Bucket Versioning 或 Lifecycle 配置
      description: 更新直接提交到 ZigFS Metadata Engine；Admin 不保存副本。
      parameters:
        - $ref: "#/components/parameters/BucketName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBucketConfigurationRequest"
      responses:
        "200":
          description: 更新后的 Bucket 配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketConfiguration"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}/versions:
    get:
      operationId: listManagementObjectVersions
      summary: 获取 Bucket 中的对象版本与 DeleteMarker
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 版本历史管理视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectVersionsResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}/objects:
    get:
      operationId: listObjects
      summary: 获取管理视图中的对象列表
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
        - name: continuation_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 对象列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectsResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/buckets/{name}/multipart-uploads:
    get:
      operationId: listManagementMultipartUploads
      summary: 列出 Bucket 中未完成的 Multipart Upload
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: prefix
          in: query
          schema:
            type: string
        - name: key_marker
          in: query
          schema:
            type: string
        - name: upload_id_marker
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 持久化的未完成上传任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMultipartUploadsResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/multipart-uploads:
    post:
      operationId: createManagementMultipartUpload
      summary: 创建可暂停和恢复的 Multipart Upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMultipartUploadRequest"
      responses:
        "201":
          description: 已创建并持久化 Upload Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultipartUpload"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/multipart-uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadID"
      - name: bucket
        in: query
        required: true
        schema:
          type: string
      - name: key
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: getManagementMultipartUpload
      summary: 查询已提交分片并恢复上传状态
      responses:
        "200":
          description: Multipart Upload 及已提交 Part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultipartUpload"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: abortManagementMultipartUpload
      summary: 取消上传并删除已提交分片
      responses:
        "204":
          description: 已取消或任务不存在
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/multipart-uploads/{uploadId}/complete:
    post:
      operationId: completeManagementMultipartUpload
      summary: 使用已提交 Part 原子完成对象
      parameters:
        - $ref: "#/components/parameters/UploadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMultipartUploadRequest"
      responses:
        "200":
          description: 已发布对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/objects/presign:
    post:
      operationId: presignObject
      summary: 生成直接访问 ZigFS 的对象 URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignObjectRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignObjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/users/{name}/access-keys:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
    get:
      operationId: listUserAccessKeys
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessKeysResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAccessKeyRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccessKeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/users/{name}/access-keys/{id}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,128}$" }
      - $ref: "#/components/parameters/AccessKeyID"
    patch:
      operationId: updateUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUserAccessKey
      description: User-scoped credentials. Ownership comes from the path; another user's key returns 404. Only creation returns secrets. Disabled users cannot create keys.
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/access-keys:
    get:
      operationId: listAccessKeys
      summary: 列出 Access Key
      responses:
        "200":
          description: Access Key 列表，不包含 Secret Key 或 Session Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessKeysResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccessKey
      summary: 创建永久 AK/SK 或临时 AK/SK/Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessKeyRequest"
      responses:
        "201":
          description: 返回已创建凭证；临时凭证额外返回 Session Token 与到期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccessKeyResponse"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/access-keys/{id}:
    patch:
      operationId: updateAccessKey
      summary: 启用或禁用 Access Key
      parameters:
        - $ref: "#/components/parameters/AccessKeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessKeyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccessKey
      summary: 删除 Access Key
      parameters:
        - $ref: "#/components/parameters/AccessKeyID"
      responses:
        "204":
          description: 已删除或不存在
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/storage:
    get:
      operationId: getStorage
      summary: 获取存储容量和状态
      responses:
        "200":
          description: 存储状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageInfo"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/storage/scanner:
    get:
      operationId: getStorageScanner
      summary: 获取分片 Scanner 状态
      responses:
        "200":
          description: 下一个分片和最近一次扫描结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageScannerStatus"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/storage/gc:
    post:
      operationId: runStorageGC
      summary: 扫描完整 namespace 并清理不可达数据
      description: >-
        清理过期 Multipart Upload，并将所有未被 Object Version、Multipart
        Manifest 或活跃 Upload 引用的数据经 Trash 后物理删除。
      responses:
        "200":
          description: 本次完整扫描和回收结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageScanReport"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/system:
    get:
      operationId: getSystem
      summary: 获取系统汇总信息
      responses:
        "200":
          description: 系统信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/health:
    get:
      operationId: getManagementHealth
      summary: 获取 Metadata Engine 和 Storage Backend 健康状态
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /_admin/v1/settings:
    get:
      operationId: getManagementSettings
      summary: 获取脱敏后的 ZigFS 生效配置
      description: >-
        仅返回可安全展示的启动级配置，不返回管理员密码、Session Secret、
        Master Key 或 AK/SK Secret。V1 配置修改后需要重启，因此本接口只读。
      responses:
        "200":
          description: 脱敏后的生效配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    managementBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-management-token
  parameters:
    BucketName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
    AccessKeyID:
      name: id
      in: path
      required: true
      description: V1 中等于 access_key，作为 Credential 的稳定管理标识。
      schema:
        type: string
    UploadID:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Fa-f0-9]{32}$"
  responses:
    Error:
      description: 失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OIDCProvider:
      type: object
      required: [provider_id, configuration_url, client_id, redirect_uri]
      description: Provider configuration stored encrypted in ZigFS. Role Policy is a comma-separated list of existing policy names, not local User roles. Environment-managed providers are imported at ZigFS startup and are read-only through this API.
      properties:
        provider_id:
          type: string
        display_name:
          type: string
        configuration_url:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scopes:
          type: string
        audiences:
          type: string
        redirect_uri:
          type: string
        claim_name:
          type: string
        claim_prefix:
          type: string
        role_policy:
          type: string
        groups_claim:
          type: string
        roles_claim:
          type: string
        email_claim:
          type: string
        username_claim:
          type: string
        enabled:
          type: boolean
        environment_managed:
          type: boolean
          readOnly: true
        has_secret:
          type: boolean
        dynamic_redirect:
          type: boolean
    UserWrite:
      type: object
      required: [name, enabled, policies]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$' }
        description: { type: string, default: '' }
        enabled: { type: boolean }
        policies:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
        groups:
          type: array
          uniqueItems: true
          maxItems: 1024
          items: { type: string }
          description: When supplied, replaces group memberships atomically. Omit to preserve; an empty array removes all memberships.
        password:
          type: string
          writeOnly: true
          description: Required on create. 8–1024 UTF-8 bytes. Omit on update to retain the existing hash. Never returned; stored as an Argon2id hash.
    ManagedUser:
      type: object
      required: [name, enabled, policies, groups, updated_at]
      properties:
        groups:
          type: array
          items: { type: string }
          readOnly: true
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix seconds; zero for legacy records without a known update time.
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedGroup:
      type: object
      required: [name, enabled, policies, members]
      properties:
        updated_at:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        description:
          type: string
          description: At most 1024 UTF-8 bytes.
          default: ''
        enabled:
          type: boolean
        policies:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
        members:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string }
    ManagedPolicy:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_.-]+$'
        document:
          type: string
          description: JSON-encoded IAM policy document, Version 2012-10-17 and Statement object or array. Maximum 256 KiB. Assigned user/group policies authorize inheriting keys. Supports Condition, NotAction and NotResource; unsupported context keys/operators are rejected.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, token_type, username, expires_at]
      properties:
        token:
          type: string
          readOnly: true
        token_type:
          type: string
          const: Bearer
        username:
          type: string
        expires_at:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, username, expires_at]
      properties:
        display_name: { type: string, description: Display-only external username claim }
        email: { type: string, description: Display-only external email claim }
        federated: { type: boolean }
        refreshable: { type: boolean }
        authenticated:
          type: boolean
          const: true
        username:
          type: string
        expires_at:
          type: integer
          format: int64
          description: Unix 时间戳，单位为秒
    Bucket:
      type: object
      additionalProperties: false
      required: [name, owner, created_at, versioning, lifecycle_enabled]
      properties:
        name:
          type: string
        owner:
          type: string
        created_at:
          type: string
          format: date-time
        versioning:
          type: string
          enum: [Unversioned, Enabled, Suspended]
        lifecycle_enabled:
          type: boolean
    ListBucketsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
    CreateBucketRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 可选。省略 Owner 时，ZigFS 使用当前已认证的管理员用户名绑定
        Bucket 所属租户；Admin BFF 不接受浏览器提交 Owner。
      required: [name]
      properties:
        name:
          type: string
        owner:
          type: string
          minLength: 1
          maxLength: 256
    BucketConfiguration:
      type: object
      additionalProperties: false
      required: [name, versioning]
      properties:
        name:
          type: string
        versioning:
          type: string
          enum: [Unversioned, Enabled, Suspended]
        lifecycle_configuration:
          type: string
          description: 原始 S3 LifecycleConfiguration XML；未配置时省略。
    UpdateBucketConfigurationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        versioning:
          type: string
          enum: [Enabled, Suspended]
        lifecycle_configuration:
          type: string
          minLength: 1
          description: ZigFS 校验并持久化的 S3 LifecycleConfiguration XML。
        clear_lifecycle:
          type: boolean
          const: true
          description: 删除已有 Lifecycle 配置；不能与 lifecycle_configuration 同时提供。
    Object:
      type: object
      required: [key, size, etag, last_modified]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
    ListObjectsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Object"
        continuation_token:
          type: string
    ObjectVersion:
      type: object
      additionalProperties: false
      required: [key, version_id, is_latest, is_delete_marker, size, last_modified]
      properties:
        key:
          type: string
        version_id:
          type: string
          description: ZigFS/S3 不透明版本标识，未版本化或 Suspended 的当前槽位为 null。
        is_latest:
          type: boolean
        is_delete_marker:
          type: boolean
        size:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
    ListObjectVersionsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObjectVersion"
    PresignObjectRequest:
      type: object
      additionalProperties: false
      required: [access_key, bucket, key, method, expires_seconds]
      properties:
        access_key:
          type: string
          description: >-
            ZigFS 使用该 Credential 的加密 Secret 生成签名，并校验其启用状态、
            Policy 和 Bucket Owner；Secret 不由调用方传入。
        bucket:
          type: string
        key:
          type: string
        method:
          type: string
          enum: [GET, PUT, DELETE]
        expires_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
        upload_id:
          type: string
          description: 与 part_number 同时提供时生成标准 UploadPart Presigned URL。
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        version_id:
          type: string
          description: GET 或 DELETE 时生成指定对象版本的 Presigned URL。
        copy_source_bucket:
          type: string
          description: >-
            与 copy_source_key 同时提供时，为 PUT 生成标准 S3 CopyObject Presigned URL；
            不能与 Multipart 或目标 version_id 同时使用。
        copy_source_key:
          type: string
          description: CopyObject 源对象 Key。
        copy_source_version_id:
          type: string
          description: 可选的 CopyObject 源 Version ID，用于将历史版本发布为新的当前版本。
    PresignObjectResponse:
      type: object
      additionalProperties: false
      required: [url, expires_at, required_headers]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            使用 Presigned URL 时必须原样携带的 Header。普通对象和 Multipart 请求为空；
            CopyObject 包含已参与签名的 x-amz-copy-source。
    MultipartUploadSummary:
      type: object
      additionalProperties: false
      required: [upload_id, bucket, key, initiated_at]
      properties:
        upload_id:
          type: string
        bucket:
          type: string
        key:
          type: string
        initiated_at:
          type: string
          format: date-time
    MultipartPart:
      type: object
      additionalProperties: false
      required: [part_number, size, etag, last_modified]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        size:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
          pattern: "^[A-Fa-f0-9]{32}$"
        last_modified:
          type: string
          format: date-time
    MultipartUpload:
      allOf:
        - $ref: "#/components/schemas/MultipartUploadSummary"
        - type: object
          required: [content_type, parts, uploaded_bytes]
          properties:
            content_type:
              type: string
            parts:
              type: array
              items:
                $ref: "#/components/schemas/MultipartPart"
            uploaded_bytes:
              type: integer
              format: int64
              minimum: 0
    ListMultipartUploadsResponse:
      type: object
      additionalProperties: false
      required: [items, is_truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MultipartUploadSummary"
        is_truncated:
          type: boolean
        next_key_marker:
          type: string
        next_upload_id_marker:
          type: string
    CreateMultipartUploadRequest:
      type: object
      additionalProperties: false
      required: [bucket, key, content_type]
      properties:
        bucket:
          type: string
        key:
          type: string
        content_type:
          type: string
    CompleteMultipartPartRequest:
      type: object
      additionalProperties: false
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          pattern: '^"?[A-Fa-f0-9]{32}"?$'
    CompleteMultipartUploadRequest:
      type: object
      additionalProperties: false
      required: [bucket, key, parts]
      properties:
        bucket:
          type: string
        key:
          type: string
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CompleteMultipartPartRequest"
    AccessKey:
      type: object
      additionalProperties: false
      required: [id, access_key, kind, owner, enabled, policy, created_at]
      properties:
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key-specific 2012-10-17 JSON policy. Empty removes this restriction. When inheriting, evaluated as an intersection with the parent permissions; otherwise replaces coarse policy permissions.
        name:
          type: string
        description:
          type: string
        inherit_policy:
          type: boolean
        id:
          type: string
          description: V1 中等于 access_key。
        access_key:
          type: string
        secret_key:
          type: string
          readOnly: true
          description: 仅 Create 返回；列表与更新响应不包含 Secret Key。不写入日志。
        session_token:
          type: string
          readOnly: true
          description: 临时凭证的 Session Token；永久凭证不返回。
        kind:
          type: string
          enum: [permanent, temporary]
        owner:
          type: string
        enabled:
          type: boolean
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 凭证的硬过期时间；无到期限制时不返回。
    ListAccessKeysResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccessKey"
    CreateUserAccessKeyRequest:
      type: object
      additionalProperties: false
      description: Ownership is derived from the user path. inherit_policy selects dynamic user/group JSON policies; otherwise explicit coarse permissions apply. Omitted expiry creates a non-expiring key.
      properties:
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key-specific 2012-10-17 JSON policy. Empty removes this restriction. When inheriting, evaluated as an intersection with the parent permissions; otherwise replaces coarse policy permissions.
        access_key:
          type: string
          pattern: '^[A-Za-z0-9]{16,128}$'
          description: Optional custom AK; generated by ZigFS when omitted.
        secret_key:
          type: string
          minLength: 32
          maxLength: 64
          writeOnly: true
          description: Printable ASCII. Temporary token credentials require exactly 40 characters. Generated when omitted.
        name:
          type: string
          maxLength: 128
          description: Optional label; 128 UTF-8 bytes maximum.
        description:
          type: string
          maxLength: 1024
          description: Optional description; 1024 UTF-8 bytes maximum.
        inherit_policy:
          type: boolean
          default: false
          description: Use parent user and enabled-group permissions, with the key policy applied as an additional restriction. Disabling inheritance never grants permissions beyond the parent; UI defaults to true.
        expires_at:
          type: string
          format: date-time
          description: Future UTC expiry, no 12-hour limit. Omit for no expiry. Cannot be combined with ttl_seconds.
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 43200
    CreateAccessKeyRequest:
      type: object
      additionalProperties: false
      description: >-
        Owner 可选。省略 Owner 时，ZigFS 使用当前已认证的管理员用户名绑定凭证租户；
        省略 policy 时创建 Full Access Credential；省略 ttl_seconds 时创建永久凭证。
      properties:
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key-specific 2012-10-17 JSON policy. Empty removes this restriction. When inheriting, evaluated as an intersection with the parent permissions; otherwise replaces coarse policy permissions.
        access_key:
          type: string
          pattern: '^[A-Za-z0-9]{16,128}$'
          description: Optional custom AK; generated by ZigFS when omitted.
        secret_key:
          type: string
          minLength: 32
          maxLength: 64
          writeOnly: true
          description: Printable ASCII. Temporary token credentials require exactly 40 characters. Generated when omitted.
        name:
          type: string
          maxLength: 128
          description: Optional label; 128 UTF-8 bytes maximum.
        description:
          type: string
          maxLength: 1024
          description: Optional description; 1024 UTF-8 bytes maximum.
        inherit_policy:
          type: boolean
          default: false
          description: Use parent user and enabled-group permissions, with the key policy applied as an additional restriction. Disabling inheritance never grants permissions beyond the parent; UI defaults to true.
        expires_at:
          type: string
          format: date-time
          description: Future UTC expiry, no 12-hour limit. Omit for no expiry. Cannot be combined with ttl_seconds.
        owner:
          type: string
          minLength: 1
          maxLength: 256
        policy:
          $ref: "#/components/schemas/CredentialPolicyInput"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 43200
          description: 提供时创建临时凭证，有效期为 60 秒至 12 小时。
    CreateAccessKeyResponse:
      allOf:
        - $ref: "#/components/schemas/AccessKey"
        - type: object
          required: [secret_key]
          properties:
            secret_key:
              type: string
              readOnly: true
            session_token:
              type: string
              description: 临时凭证必须返回；永久凭证不返回。
      unevaluatedProperties: false
    UpdateAccessKeyRequest:
      type: object
      additionalProperties: false
      description: Sparse PATCH. Omitted fields are preserved. AK/SK cannot be changed. clear_expiry removes expiry for non-token keys; cannot be combined with expires_at.
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        inherit_policy:
          type: boolean
        expires_at:
          type: string
          format: date-time
        clear_expiry:
          type: boolean
        policy_document:
          type: string
          maxLength: 262144
          description: Optional key-specific 2012-10-17 JSON policy. Empty removes this restriction. When inheriting, evaluated as an intersection with the parent permissions; otherwise replaces coarse policy permissions.
        enabled:
          type: boolean
    CredentialPolicy:
      type: object
      additionalProperties: false
      required: [bucket_read, bucket_write, object_read, object_write]
      properties:
        bucket_read:
          type: boolean
          default: true
        bucket_write:
          type: boolean
          default: true
        object_read:
          type: boolean
          default: true
        object_write:
          type: boolean
          default: true
    CredentialPolicyInput:
      type: object
      additionalProperties: false
      description: 创建请求中的可选策略字段；省略字段时 ZigFS 使用 true。
      properties:
        bucket_read:
          type: boolean
          default: true
        bucket_write:
          type: boolean
          default: true
        object_read:
          type: boolean
          default: true
        object_write:
          type: boolean
          default: true
    StorageInfo:
      type: object
      additionalProperties: false
      description: >-
        V1 使用 ZigFS 当前可见 Object Metadata 汇总逻辑对象字节数。
        Linux/macOS 通过容量 Backend 的 fstatvfs 读取数据目录所在文件系统的容量。
        physical_used 是总块数减空闲块数；available 是调用者可用容量，保留块不算已用。
        不支持的平台或读取失败返回 null；used 始终为逻辑对象字节数。
      required: [measurement, total, used, available, physical_used]
      properties:
        physical_used:
          type: [integer, "null"]
          format: int64
          minimum: 0
        measurement:
          type: string
          const: logical_object_bytes
        total:
          type: [integer, "null"]
          format: int64
          minimum: 0
        used:
          type: integer
          format: int64
          minimum: 0
        available:
          type: [integer, "null"]
          format: int64
          minimum: 0
    StorageScanReport:
      type: object
      additionalProperties: false
      required:
        - partition
        - partitions
        - scanned_generations
        - retained_generations
        - removed_generations
        - scanned_bytes
        - retained_bytes
        - removed_bytes
        - expired_multipart_uploads
      properties:
        partition:
          type: [integer, "null"]
          minimum: 0
          maximum: 15
          description: 分片扫描时为 0 至 15；完整 GC 时为 null。
        partitions:
          type: integer
          minimum: 1
        scanned_generations:
          type: integer
          minimum: 0
        retained_generations:
          type: integer
          minimum: 0
        removed_generations:
          type: integer
          minimum: 0
        scanned_bytes:
          type: integer
          format: int64
          minimum: 0
        retained_bytes:
          type: integer
          format: int64
          minimum: 0
        removed_bytes:
          type: integer
          format: int64
          minimum: 0
        expired_multipart_uploads:
          type: integer
          minimum: 0
    StorageScannerStatus:
      type: object
      additionalProperties: false
      required: [partitions, next_partition, last_scan]
      properties:
        running:
          type: boolean
        last_completed_at:
          type: [integer, "null"]
          description: Unix seconds of last successful scan since startup; retained after failed attempts.
        last_duration_ms:
          type: [integer, "null"]
          description: Monotonic duration of last completed attempt, including failure.
          minimum: 0
        last_attempt_succeeded:
          type: [boolean, "null"]
        partitions:
          type: integer
          const: 16
        next_partition:
          type: integer
          minimum: 0
          maximum: 15
        last_scan:
          oneOf:
            - $ref: "#/components/schemas/StorageScanReport"
            - type: "null"
    SystemInfo:
      type: object
      required: [version, uptime, storage_used, objects, buckets]
      properties:
        version:
          type: string
        uptime:
          type: integer
          format: int64
        storage_used:
          type: integer
          format: int64
        objects:
          type: integer
          format: int64
        buckets:
          type: integer
          format: int64
    Health:
      type: object
      additionalProperties: false
      required: [status, recovery, reason, actions]
      properties:
        status:
          type: string
          enum: [ready, degraded, recovery]
        recovery:
          type: string
          enum: [initializing, recovering, ready, recovery_required]
        reason:
          type: string
          enum:
            - none
            - corrupt_journal
            - corrupt_record
            - inconsistent_journal
            - unrecoverable_transaction
            - unavailable
            - out_of_memory
        actions:
          type: array
          items:
            type: string
            enum: [inspect_logs, restore_from_backup]
    Settings:
      type: object
      additionalProperties: false
      required:
        - api_address
        - s3_public_endpoint
        - s3_virtual_hosted_style
        - s3_region
        - request_time_skew_seconds
        - multipart_expiry_seconds
        - lifecycle_scan_interval_seconds
        - stream_buffer_size
        - metrics_enabled
        - metrics_address
        - admin_session_ttl_seconds
        - reload_required
      properties:
        api_address:
          type: string
        s3_public_endpoint:
          type: string
          format: uri
        s3_virtual_hosted_style:
          type: boolean
        s3_region:
          type: string
        request_time_skew_seconds:
          type: integer
          format: int64
        multipart_expiry_seconds:
          type: integer
          format: int64
        lifecycle_scan_interval_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
        stream_buffer_size:
          type: integer
          format: int64
        metrics_enabled:
          type: boolean
        metrics_address:
          type: string
        admin_session_ttl_seconds:
          type: integer
          format: int64
        reload_required:
          type: boolean
          const: true
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          enum:
            - Unauthorized
            - NotFound
            - PayloadTooLarge
            - InvalidOwner
            - InvalidAccessKey
            - AccessKeyNotFound
            - AccessKeyDisabled
            - InvalidCredentialTTL
            - Conflict
            - CorruptMetadata
            - CorruptData
            - StorageUnavailable
            - StorageNotReady
            - MethodNotAllowed
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
