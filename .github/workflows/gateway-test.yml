name: Network and gateway checks
on:
  push:
    tags:
      - '**'

jobs:
  test:
    # Only execute for newly created tags, not tag updates or deletions.
    if: github.event.created == true && github.event.deleted == false
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/gateway/go.mod
          cache-dependency-path: |
            pkg/gateway/go.sum
            zigfs-admin/server/go.sum
      - name: Independent gateway module
        working-directory: pkg/gateway
        run: GOWORK=off go test -race ./...
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Native Zig / Mbed TLS transport C ABI
        working-directory: pkg/net-transport
        run: zig build test
      - name: Native transport HTTP and TLS regressions
        if: runner.os != 'Windows'
        working-directory: pkg/net-transport
        run: |
          zig build http-probe
          python3 tests/http_tls.py
      - name: Native CLI unit tests and build
        if: runner.os != 'Windows'
        working-directory: zigfs-cli
        run: |
          zig build test
          zig build
      - name: Admin integration
        working-directory: zigfs-admin/server
        run: go test ./...

  https-conformance:
    # Only execute for newly created tags, not tag updates or deletions.
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zigfs-admin/server/go.mod
          cache-dependency-path: |
            pkg/gateway/go.sum
            zigfs-admin/server/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build isolated test services
        run: |
          cd zigfs
          zig build
          zig build event-delivery-probe
          cd ../zigfs-admin/server
          go build -o /tmp/zigfs-admin-gateway ./cmd/admin
      - name: Native CLI protocol conformance
        working-directory: zigfs-cli
        run: |
          zig build
          python3 tests/cli_smoke.py zig-out/bin/zc
          python3 tests/alias_smoke.py zig-out/bin/zc
          python3 tests/s3api_integration.py zig-out/bin/zc ../zigfs/zig-out/bin/zigfs
      - name: Strict TLS and S3 conformance
        run: python3 conformance/gateway_https.py --admin /tmp/zigfs-admin-gateway
      - name: Outbound HTTP and MQTT conformance
        run: python3 conformance/event_delivery.py
