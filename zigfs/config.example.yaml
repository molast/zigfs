# ZigFS loads built-in defaults first, then applies values from this file.
server:
  api_address: "0.0.0.0:9000"

observability:
  metrics_enabled: true
  metrics_address: "127.0.0.1:9090"

storage:
  data_root: "data"
  stream_buffer_size: 65536

s3:
  region: "us-east-1"
  request_time_skew_seconds: 900
  multipart_expiry_seconds: 604800

# Bootstrap administrator identity is owned and verified by ZigFS.
# Change these values before exposing either API outside a trusted local network.
admin:
  username: "admin"
  password: "zigfs-admin"
  session_secret: "zigfs-local-session-secret-change-before-production"
  session_ttl_seconds: 28800
