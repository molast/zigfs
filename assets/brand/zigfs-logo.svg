
<svg width="256" height="256" viewBox="0 0 256 256"
     fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="ZigFS logo">
  <title>ZigFS</title>

  <defs>
    <linearGradient id="zgrad" x1="56" y1="56" x2="200" y2="200"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7A41D"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>

    <linearGradient id="cgrad" x1="108" y1="64" x2="192" y2="192"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EE6A8"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>

    <clipPath id="zclip">
      <path d="M56 56H200V88L112 168H200V200H56V168L144 88H56V56Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="#05070D"/>

  <!-- Distributed topology -->
  <g stroke="#2EE6A8" stroke-width="1.5"
     stroke-opacity="0.09">
    <path d="M40 64L128 32L216 64V192L128 224L40 192V64Z"/>
    <path d="M128 32V224"/>
  </g>

  <g fill="#2EE6A8" fill-opacity="0.55">
    <circle cx="128" cy="32" r="2.5"/>
    <circle cx="216" cy="64" r="2.5"/>
    <circle cx="216" cy="192" r="2.5"/>
    <circle cx="128" cy="224" r="2.5"/>
    <circle cx="40" cy="192" r="2.5"/>
    <circle cx="40" cy="64" r="2.5"/>
  </g>

  <!-- Main Z -->
  <path
    d="M56 56H200V88L112 168H200V200H56V168L144 88H56V56Z"
    fill="url(#zgrad)"/>

  <!-- Data segmentation -->
  <g clip-path="url(#zclip)"
     stroke="#05070D" stroke-width="5">
    <path d="M56 76H200"/>
    <path d="M56 180H200"/>
  </g>

  <!-- Replication blocks -->
  <g clip-path="url(#zclip)">
    <rect x="165" y="61" width="23" height="13"
          rx="2" fill="url(#cgrad)"/>

    <rect x="122" y="119" width="25" height="13"
          rx="2" fill="url(#cgrad)"
          transform="rotate(-42 134.5 125.5)"/>

    <rect x="68" y="183" width="23" height="12"
          rx="2" fill="url(#cgrad)"/>
  </g>

  <!-- Heartbeat / failover node -->
  <circle cx="216" cy="88" r="4" fill="#2EE6A8"/>
  <circle cx="216" cy="88" r="8"
          stroke="#2EE6A8" stroke-opacity="0.35"
          stroke-width="1.5"/>
</svg>
